[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic_grasp"
version = "0.0.1"
description = "Agentic SAM+ZeroGrasp pipeline for the DOS-W1 dual-arm rig."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["agentic_grasp*"]

[tool.ruff]
line-length = 100
target-version = "py310"
