[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medicine-agentic"
version = "0.1.0"
description = "Skill-first workflow for the RUC-WONE medicine packing task."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "h5py>=3.8",
  "requests>=2.31",
]

[project.scripts]
medicine-dry-run = "medicine_agentic.cli:main"
medicine-tcp-pivot = "medicine_agentic.tcp_pivot_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medicine_agentic = ["web_static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
